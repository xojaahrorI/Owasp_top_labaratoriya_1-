{% extends "shop/base.html" %}
{% block title %}Profil - NestMarket{% endblock %}
{% block content %}
<h3 class="mb-3">Profilim</h3>
<div class="row">
  <div class="col-md-6">
    <form method="post" class="card p-4">
      {% csrf_token %}
      <div class="mb-2"><label class="form-label">Foydalanuvchi nomi</label><input class="form-control" value="{{ user.username }}" disabled></div>
      <div class="mb-2"><label class="form-label">Rol</label><input class="form-control" value="{{ profile.role }}" disabled></div>
      <div class="mb-2"><label class="form-label">Telefon</label><input name="phone" class="form-control" value="{{ profile.phone }}"></div>
      <div class="mb-3"><label class="form-label">Bio</label><textarea name="bio" class="form-control" rows="3">{{ profile.bio }}</textarea></div>
      <button class="btn btn-primary">Saqlash</button>
    </form>
  </div>
  <div class="col-md-6">
    <div class="card p-4">
      <h6>Boshqa bo'limlar</h6>
      <p><a href="/account/security/">🔐 Xavfsizlik / Parolni tiklash</a></p>
      <p><a href="/account/wishlist/import/">📥 Sozlamalarni zaxiradan tiklash</a></p>
      <p><a href="/account/progress/">🧪 Xavfsizlik bahosi</a></p>
    </div>
  </div>
</div>
{% endblock %}
